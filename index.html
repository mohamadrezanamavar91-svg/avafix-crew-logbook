<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AvaFix - لاگ‌بوک پروازی کادر پرواز</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #131c31;
      --card-border: #223055;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    header {
      background: linear-gradient(180deg, #131d36 0%, #0a0f1d 100%);
      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon { font-size: 1.8rem; }
    .brand-title { font-size: 1.25rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 0.75rem; color: var(--primary); font-weight: 500; }

    main { width: 100%; max-width: 600px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    
    input, select {
      background: #0d1527;
      border: 1px solid #2d3f6d;
      border-radius: 8px;
      color: #fff;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:active { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Leg Table / List */
    .legs-list { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    .leg-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #090e1a;
      border: 1px solid #1a2542;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal-box {
      background: #131c31;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 450px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1;
    }

    /* History table */
    .history-card { margin-top: 10px; }
    .duty-record {
      background: #0d1527;
      border: 1px solid #1f2d50;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-icon">✈️</span>
      <div>
        <div class="brand-title">AvaFix Logbook</div>
        <div class="brand-subtitle">سیستم مدیریت و ثبت کارکرد پروازی</div>
      </div>
    </div>
  </header>

  <main>
    <!-- بخش ثبت وظیفه / پرواز -->
    <div class="card">
      <div class="card-title">📝 ثبت پرواز جدید</div>

      <div class="form-group">
        <label>تاریخ پرواز (شمسی / میلادی)</label>
        <input type="text" id="flightDate" placeholder="مثال: ۱۴۰۳/۰۷/۱۰">
      </div>

      <div class="form-group">
        <label>انتخاب مسیر</label>
        <div style="display: flex; gap: 8px;">
          <select id="routeSelect" style="flex: 1;"></select>
          <button type="button" id="btnOpenManageRoutes" class="btn btn-secondary" title="مدیریت مسیرها">
            ⚙️ مسیرها
          </button>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 6px;">
        <button type="button" id="btnAddLeg" class="btn btn-primary" style="flex: 1;">
          ➕ اضافه کردن این لگ
        </button>
      </div>

      <!-- لیست لگ‌های ثبت‌شده در این پرواز -->
      <div style="margin-top: 15px;">
        <label style="font-size: 0.85rem; color: var(--text-muted);">لگ‌های انتخاب‌شده برای این دیوتی:</label>
        <div class="legs-list" id="currentLegsList">
          <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">هنوز لگی اضافه نشده است.</div>
        </div>
      </div>

      <!-- مجموع زمان -->
      <div style="display: flex; justify-content: space-between; align-items: center; background: #090e1a; padding: 10px 14px; border-radius: 8px; margin: 12px 0;">
        <span style="font-size: 0.9rem; color: var(--text-muted);">مجموع ساعت پرواز (Block):</span>
        <strong id="totalDutyTime" style="color: var(--accent); font-size: 1.1rem;">00:00</strong>
      </div>

      <button type="button" id="btnSaveDuty" class="btn btn-accent" style="width: 100%; font-size: 1rem; padding: 12px;" disabled>
        💾 ثبت نهایی در لاگ‌بوک ماهانه
      </button>
    </div>

    <!-- سوابق پروازها -->
    <div class="card history-card">
      <div class="card-title" style="justify-content: space-between;">
        <span>📊 کارکرد ماه جاری</span>
        <span id="monthlyTotalDisplay" style="color: var(--primary); font-size: 0.9rem;">مجموع: 00:00</span>
      </div>
      <div id="dutiesHistoryList"></div>
    </div>
  </main>

  <!-- مودال مدیریت مسیرها -->
  <div id="routesModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size: 1rem; color: var(--primary);">✈️ مدیریت و ویرایش مسیرها</h3>
        <button type="button" id="btnCloseModal" style="background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editRouteIndex" value="-1">
        
        <div class="form-group">
          <label>کد مسیر (مبدأ - مقصد)</label>
          <input type="text" id="routeCodeInput" placeholder="مثال: THR-SYZ یا مشهد - شیراز">
        </div>

        <div class="form-group">
          <label>زمان پرواز (فرمت 01:25 یا دقیقه 85)</label>
          <input type="text" id="routeTimeInput" placeholder="01:25">
        </div>

        <button type="button" id="btnSaveCustomRoute" class="btn btn-primary" style="width: 100%; margin-bottom: 15px;">
          ➕ ثبت مسیر
        </button>

        <div style="border-top: 1px solid var(--card-border); padding-top: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 0.85rem; color: var(--text-muted);">لیست همه مسیرها:</span>
            <button type="button" id="btnResetRoutes" style="background: none; border: none; color: var(--danger); font-size: 0.75rem; cursor: pointer;">بازنشانی پیش‌فرض</button>
          </div>
          <div id="modalRoutesList" style="display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_ROUTES = 'avafix_custom_routes';
    const STORAGE_KEY_DUTIES = 'avafix_monthly_duties';

    const INITIAL_ROUTES = [
      { name: "THR ➔ MHD", minutes: 105, displayTime: "01:45" },
      { name: "MHD ➔ THR", minutes: 105, displayTime: "01:45" },
      { name: "THR ➔ SYZ", minutes: 80,  displayTime: "01:20" },
      { name: "SYZ ➔ THR", minutes: 80,  displayTime: "01:20" },
      { name: "THR ➔ KIH", minutes: 105, displayTime: "01:45" },
      { name: "KIH ➔ THR", minutes: 105, displayTime: "01:45" },
      { name: "THR ➔ TBZ", minutes: 65,  displayTime: "01:05" },
      { name: "TBZ ➔ THR", minutes: 65,  displayTime: "01:05" },
      { name: "THR ➔ AWZ", minutes: 70,  displayTime: "01:10" },
      { name: "AWZ ➔ THR", minutes: 70,  displayTime: "01:10" }
    ];

    let routes = [];
    let currentLegs = [];
    let duties = [];

    function formatMinToHHMM(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function parseToMinutes(input) {
      if (!input) return 0;
      input = input.toString().trim();
      if (input.includes(':')) {
        const parts = input.split(':');
        return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
      }
      return parseInt(input, 10) || 0;
    }

    function loadRoutes() {
      const saved = localStorage.getItem(STORAGE_KEY_ROUTES);
      if (saved) {
        try { routes = JSON.parse(saved); } catch(e) { routes = [...INITIAL_ROUTES]; }
      } else {
        routes = [...INITIAL_ROUTES];
      }
      updateRouteDropdown();
    }

    function saveRoutes() {
      localStorage.setItem(STORAGE_KEY_ROUTES, JSON.stringify(routes));
      updateRouteDropdown();
      renderModalRoutesList();
    }

    function updateRouteDropdown() {
      const select = document.getElementById('routeSelect');
      select.innerHTML = '';
      routes.forEach((r, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${r.name} (${r.displayTime || formatMinToHHMM(r.minutes)})`;
        select.appendChild(opt);
      });
    }

    function renderModalRoutesList() {
      const container = document.getElementById('modalRoutesList');
      container.innerHTML = '';
      routes.forEach((r, idx) => {
        const item = document.createElement('div');
        item.style = "display: flex; justify-content: space-between; align-items: center; background: #090e1a; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem;";
        item.innerHTML = `
          <div>
            <div style="font-weight: 600;">${r.name}</div>
            <div style="font-size: 0.75rem; color: var(--primary);">${formatMinToHHMM(r.minutes)}</div>
          </div>
          <div style="display: flex; gap: 4px;">
            <button onclick="onEditRoute(${idx})" style="background: #eab308; border: none; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; cursor: pointer;">✏️</button>
            <button onclick="onDeleteRoute(${idx})" style="background: #ef4444; border: none; border-radius: 4px; padding: 3px 6px; font-size: 0.75rem; color: #fff; cursor: pointer;">🗑️</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.onEditRoute = function(idx) {
      const r = routes[idx];
      document.getElementById('routeCodeInput').value = r.name;
      document.getElementById('routeTimeInput').value = formatMinToHHMM(r.minutes);
      document.getElementById('editRouteIndex').value = idx;
      document.getElementById('btnSaveCustomRoute').textContent = '💾 ذخیره تغییرات';
    };

    window.onDeleteRoute = function(idx) {
      if (confirm('این مسیر حذف شود؟')) {
        routes.splice(idx, 1);
        saveRoutes();
      }
    };

    // لگ‌ها و دیوتی
    function renderLegs() {
      const list = document.getElementById('currentLegsList');
      list.innerHTML = '';
      let totalMins = 0;

      if (currentLegs.length === 0) {
        list.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 10px;">هنوز لگی اضافه نشده است.</div>';
      } else {
        currentLegs.forEach((leg, idx) => {
          totalMins += leg.minutes;
          const el = document.createElement('div');
          el.className = 'leg-item';
          el.innerHTML = `
            <span>${idx + 1}. ${leg.name} (${formatMinToHHMM(leg.minutes)})</span>
            <button onclick="removeLeg(${idx})" style="background: none; border: none; color: var(--danger); font-size: 1rem; cursor: pointer;">&times;</button>
          `;
          list.appendChild(el);
        });
      }

      document.getElementById('totalDutyTime').textContent = formatMinToHHMM(totalMins);
      document.getElementById('btnSaveDuty').disabled = (currentLegs.length === 0);
    }

    window.removeLeg = function(idx) {
      currentLegs.splice(idx, 1);
      renderLegs();
    };

    // لود تاریخچه دیوتی‌ها
    function loadDuties() {
      const saved = localStorage.getItem(STORAGE_KEY_DUTIES);
      duties = saved ? JSON.parse(saved) : [];
      renderDuties();
    }

    function renderDuties() {
      const container = document.getElementById('dutiesHistoryList');
      container.innerHTML = '';
      let grandTotalMins = 0;

      duties.forEach((d, idx) => {
        grandTotalMins += d.totalMinutes;
        const div = document.createElement('div');
        div.className = 'duty-record';
        div.innerHTML = `
          <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem;">
            <span>📅 ${d.date || 'بدون تاریخ'}</span>
            <span style="color: var(--accent);">${formatMinToHHMM(d.totalMinutes)}</span>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
            ${d.legs.map(l => l.name).join(' ➔ ')}
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('monthlyTotalDisplay').textContent = 'مجموع: ' + formatMinToHHMM(grandTotalMins);
    }

    // رویدادها
    document.addEventListener('DOMContentLoaded', () => {
      loadRoutes();
      loadDuties();

      const modal = document.getElementById('routesModal');
      document.getElementById('btnOpenManageRoutes').onclick = () => {
        renderModalRoutesList();
        modal.style.display = 'flex';
      };
      document.getElementById('btnCloseModal').onclick = () => {
        modal.style.display = 'none';
        resetRouteInputs();
      };

      document.getElementById('btnSaveCustomRoute').onclick = () => {
        const name = document.getElementById('routeCodeInput').value.trim();
        const mins = parseToMinutes(document.getElementById('routeTimeInput').value);
        const editIdx = parseInt(document.getElementById('editRouteIndex').value, 10);

        if (!name || mins <= 0) {
          alert('لطفاً نام مسیر و زمان پرواز معتبر وارد کنید.');
          return;
        }

        if (editIdx >= 0) {
          routes[editIdx] = { name, minutes: mins, displayTime: formatMinToHHMM(mins) };
        } else {
          routes.push({ name, minutes: mins, displayTime: formatMinToHHMM(mins) });
        }

        saveRoutes();
        resetRouteInputs();
      };

      document.getElementById('btnResetRoutes').onclick = () => {
        if (confirm('تمام مسیرها به لیست پیش‌فرض برگردند؟')) {
          routes = [...INITIAL_ROUTES];
          saveRoutes();
        }
      };

      document.getElementById('btnAddLeg').onclick = () => {
        const idx = document.getElementById('routeSelect').value;
        if (idx !== "") {
          currentLegs.push(routes[idx]);
          renderLegs();
        }
      };

      document.getElementById('btnSaveDuty').onclick = () => {
        const date = document.getElementById('flightDate').value.trim() || new Date().toLocaleDateString('fa-IR');
        const totalMinutes = currentLegs.reduce((sum, leg) => sum + leg.minutes, 0);

        duties.unshift({ date, legs: [...currentLegs], totalMinutes });
        localStorage.setItem(STORAGE_KEY_DUTIES, JSON.stringify(duties));

        currentLegs = [];
        renderLegs();
        renderDuties();
        alert('پرواز با موفقیت در لاگ‌بوک ثبت شد.');
      };

      function resetRouteInputs() {
        document.getElementById('routeCodeInput').value = '';
        document.getElementById('routeTimeInput').value = '';
        document.getElementById('editRouteIndex').value = '-1';
        document.getElementById('btnSaveCustomRoute').textContent = '➕ ثبت مسیر';
      }
    });
  </script>
</body>
</html>
